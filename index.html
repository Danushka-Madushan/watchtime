<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watchlist</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232f5bea'/><path d='M38 30l34 20-34 20z' fill='white'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceef1; --surface:#ffffff; --ink:#15181e; --muted:#6a7280; --line:#dde0e5;
  --accent:#2f5bea; --accent-ink:#fff; --ok:#17995b; --danger:#d23f3f;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#14161a; --surface:#1d2025; --ink:#eceef1; --muted:#8b93a1; --line:#2b2f36;
  --accent:#6f8cff; --accent-ink:#0e1118; --ok:#3ec585; --danger:#ff7676; color-scheme:dark;
}}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{font:15px/1.45 "DM Sans",system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg{display:block;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

header{position:sticky;top:0;z-index:5;background:var(--bg);padding:16px 0 10px}
.bar{display:flex;gap:10px;align-items:center}
h1{font-size:20px;font-weight:700;letter-spacing:-.01em;margin-right:6px}
.field{height:44px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 14px;outline:none;width:100%}
.field:focus{border-color:var(--accent)}
.search{flex:1;min-width:0}
.year{flex:0 0 92px}
.icon{width:44px;height:44px;border-radius:8px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.icon:hover{border-color:var(--accent)}
.status{font-size:13px;color:var(--muted);min-height:20px;margin-top:8px}
.status.err{color:var(--danger)}
.status button{color:var(--accent);font-weight:500;margin-left:6px}

.results{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin:4px 0 20px;overflow:hidden}
.rhead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rhead .count{flex:1;color:var(--muted);font-size:13px;min-width:120px}
.res{display:flex;gap:14px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:0}
.res img,.res .ph{width:40px;height:60px;border-radius:4px;object-fit:cover;background:var(--bg);flex:none}
.res .t{flex:1;min-width:0}
.res .t b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .t span{color:var(--muted);font-size:13px}
.more{padding:10px;text-align:center;border-top:1px solid var(--line)}
.note{padding:16px 12px;color:var(--muted)}

.btn{height:34px;padding:0 14px;border-radius:6px;font-weight:500;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{background:var(--bg);color:var(--muted);cursor:default;filter:none}
.btn.ghost{background:var(--bg);color:var(--ink)}
.btn.ghost:hover{background:var(--line);filter:none}

.filters{display:flex;gap:10px 12px;flex-wrap:wrap;align-items:center;margin:8px 0 20px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px}
.seg button{padding:6px 12px;border-radius:5px;color:var(--muted);font-weight:500;display:flex;gap:6px;align-items:center}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.seg .n{font-size:12px;opacity:.7}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.chip{padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:13px}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
select.sort{height:36px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 10px;font-size:13px;color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:24px 16px;padding-bottom:60px}
.card{display:flex;flex-direction:column;min-width:0}
.poster{position:relative;aspect-ratio:2/3;border-radius:6px;overflow:hidden;background:var(--line);display:grid;place-items:center;align-content:center;gap:6px;color:var(--muted);font-size:12px;text-align:center}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card.done .poster img{opacity:.45}
.badge{position:absolute;top:8px;left:8px;background:var(--ok);color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:4px}
.pbtn{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:6px;background:rgba(15,17,21,.62);color:#fff;display:grid;place-items:center}
.pbtn:hover{background:rgba(15,17,21,.85)}
.card h3{font-size:14px;font-weight:500;line-height:1.3;margin-top:8px;min-height:2.6em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card p{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:6px;margin-top:auto;padding-top:10px}
.acts .btn{flex:1;font-size:13px;height:34px;padding:0 8px;min-width:0}
.acts .x{flex:none;width:34px;padding:0;color:var(--danger);display:grid;place-items:center}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:80px 0}

dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:24px;width:min(440px,92vw)}
dialog::backdrop{background:rgba(10,12,16,.55)}
dialog h2{font-size:17px;margin-bottom:4px}
dialog p.hint{color:var(--muted);font-size:13px;margin-bottom:12px}
label{display:block;font-size:13px;font-weight:500;margin:12px 0 4px}
dialog .field{background:var(--bg);height:40px;border-radius:6px;padding:0 12px}
.row{display:flex;gap:8px}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.foot .left{margin-right:auto}
.pv{display:flex;gap:16px;margin-top:8px}
.prev{width:96px;aspect-ratio:2/3;background:var(--line);border-radius:6px;overflow:hidden;flex:none}
.prev img{width:100%;height:100%;object-fit:cover;display:block}
.pv .side{flex:1;min-width:0}
.pst{font-size:13px;color:var(--muted);margin-top:8px}
.pst.err{color:var(--danger)}
@media (max-width:560px){h1{display:none}.grid{grid-template-columns:repeat(2,1fr)}.year{flex-basis:76px}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="bar">
    <h1>Watchlist</h1>
    <input class="field search" id="q" type="search" placeholder="Search IMDb for a movie or series" autocomplete="off" aria-label="Search">
    <input class="field year" id="year" inputmode="numeric" maxlength="4" placeholder="Year" autocomplete="off" aria-label="Release year">
    <button class="icon" id="gear" aria-label="Settings" title="Settings"></button>
  </div>
  <div class="status" id="status" role="status"></div>
</div></header>

<main class="wrap">
  <section id="results" class="results" hidden aria-live="polite"></section>
  <div class="filters">
    <div class="seg" id="seg"></div>
    <div class="chips" id="chips"></div>
    <select class="sort" id="sort" aria-label="Sort">
      <option value="added">Recently added</option>
      <option value="title">Title A–Z</option>
      <option value="year">Newest release</option>
    </select>
  </div>
  <div class="grid" id="grid"></div>
</main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2>Settings</h2>
    <p class="hint">Stored only in this browser. The token lets the page save your list to the repo.</p>
    <label for="f-omdb">OMDb API key (free at omdbapi.com/apikey.aspx)</label>
    <input class="field" id="f-omdb" autocomplete="off">
    <label for="f-token">GitHub token (fine-grained, Contents: read and write)</label>
    <input class="field" id="f-token" type="password" autocomplete="off">
    <div class="row">
      <div style="flex:1"><label for="f-owner">Repo owner</label><input class="field" id="f-owner" autocomplete="off"></div>
      <div style="flex:1"><label for="f-repo">Repo name</label><input class="field" id="f-repo" autocomplete="off"></div>
    </div>
    <label for="f-branch">Branch (leave empty for default)</label>
    <input class="field" id="f-branch" autocomplete="off">
    <div class="foot">
      <button type="button" class="btn ghost" id="cancel">Cancel</button>
      <button class="btn" value="save">Save settings</button>
    </div>
  </form>
</dialog>

<dialog id="pdlg">
  <h2>Change poster</h2>
  <p class="hint" id="p-title"></p>
  <label for="p-url">Image link</label>
  <input class="field" id="p-url" type="url" placeholder="https://…/poster.jpg" autocomplete="off">
  <div class="pv">
    <div class="prev"><img id="p-img" alt="Poster preview" referrerpolicy="no-referrer" hidden></div>
    <div class="side"><div class="pst" id="p-st"></div></div>
  </div>
  <div class="foot">
    <button type="button" class="btn ghost left" id="p-refetch">Refetch from IMDb</button>
    <button type="button" class="btn ghost" id="p-cancel">Cancel</button>
    <button type="button" class="btn" id="p-save">Save poster</button>
  </div>
</dialog>

<script>
const PATH = 'data/movies.json';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const svg = (d, s = 18) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="currentColor" aria-hidden="true"><path d="${d}"/></svg>`;
const P = {
  image:'M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z',
  del:'M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z',
  gear:'M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z'
};
$('gear').innerHTML = svg(P.gear, 20);

// ---------- config ----------
function guessRepo() {
  const m = location.hostname.match(/^(.+)\.github\.io$/);
  if (!m) return {owner:'', repo:''};
  const seg = location.pathname.split('/').filter(Boolean)[0];
  return {owner:m[1], repo: seg || location.hostname};
}
function loadCfg() {
  let c = {};
  try { c = JSON.parse(localStorage.getItem('watchlist-cfg') || '{}'); } catch {}
  const g = guessRepo();
  return {omdb:'', token:'', branch:'', owner:g.owner, repo:g.repo, ...c};
}
let cfg = loadCfg();
const saveCfg = () => { try { localStorage.setItem('watchlist-cfg', JSON.stringify(cfg)); } catch {} };

// ---------- state ----------
let movies = [], view = 'all', genre = 'all', sort = 'added', searchTimer, saveChain = Promise.resolve();
const S = {title:'', year:'', type:'', page:1, total:0, items:[]};

let statusTimer;
function setStatus(msg, err, action) {
  const s = $('status');
  clearTimeout(statusTimer);
  s.className = 'status' + (err ? ' err' : '');
  s.textContent = msg || '';
  if (action) { const b = document.createElement('button'); b.textContent = 'Open settings'; b.onclick = openSettings; s.append(b); }
  if (msg && !err && !action && !msg.endsWith('…')) statusTimer = setTimeout(() => { s.textContent = ''; }, 3000);
}

// ---------- GitHub storage ----------
const api = () => `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${PATH}`;
const ghHeaders = extra => ({Authorization:`Bearer ${cfg.token}`, 'X-GitHub-Api-Version':'2022-11-28', ...extra});
const refQ = () => cfg.branch ? `?ref=${encodeURIComponent(cfg.branch)}` : '';
const b64 = str => { const b = new TextEncoder().encode(str); let s = ''; b.forEach(x => s += String.fromCharCode(x)); return btoa(s); };

async function load() {
  try {
    let res;
    if (cfg.token && cfg.owner && cfg.repo) {
      res = await fetch(api() + refQ(), {headers: ghHeaders({Accept:'application/vnd.github.raw+json'}), cache:'no-store'});
      if (res.status === 404) { movies = []; render(); return; }
    } else {
      res = await fetch(PATH + '?t=' + Date.now(), {cache:'no-store'});
    }
    if (!res.ok) throw new Error('Could not load your list (' + res.status + ')');
    movies = await res.json();
  } catch (e) { setStatus(e.message, true); }
  render();
}

function persist(message) {
  if (!cfg.token || !cfg.owner || !cfg.repo) { setStatus('Add a GitHub token in settings to save changes.', true, true); return; }
  const snapshot = JSON.stringify(movies, null, 2) + '\n';
  saveChain = saveChain.then(async () => {
    setStatus('Saving…');
    try {
      let sha;
      const g = await fetch(api() + refQ(), {headers: ghHeaders({Accept:'application/vnd.github+json'}), cache:'no-store'});
      if (g.ok) sha = (await g.json()).sha; else if (g.status !== 404) throw new Error('GitHub error ' + g.status);
      const body = {message, content: b64(snapshot), sha};
      if (cfg.branch) body.branch = cfg.branch;
      const p = await fetch(api(), {method:'PUT', headers: ghHeaders({Accept:'application/vnd.github+json','Content-Type':'application/json'}), body: JSON.stringify(body)});
      if (!p.ok) throw new Error((await p.json().catch(() => ({}))).message || 'Save failed (' + p.status + ')');
      setStatus('Saved to repo');
    } catch (e) { setStatus(e.message, true); }
  });
}

// ---------- OMDb (IMDb data) ----------
async function omdb(params) {
  if (!cfg.omdb) throw new Error('Add your OMDb API key in settings.');
  const u = new URL('https://www.omdbapi.com/');
  Object.entries({apikey:cfg.omdb, ...params}).forEach(([k, v]) => v !== '' && v != null && u.searchParams.set(k, v));
  const j = await (await fetch(u)).json();
  if (j.Response === 'False' && !/not found|too many/i.test(j.Error)) throw new Error(j.Error);
  return j;
}

// "resident evil 2002" or "resident evil (2002)" works without touching the year box
function readQuery() {
  const raw = $('q').value.trim();
  let year = $('year').value.trim();
  if (!/^\d{4}$/.test(year)) year = '';
  let title = raw;
  const m = raw.match(/^(.*\S)\s+\(?((?:18|19|20)\d{2})\)?$/);
  if (m && !year) { title = m[1]; year = m[2]; }
  return {title, year};
}

async function runSearch(reset = true) {
  if (reset) { const {title, year} = readQuery(); Object.assign(S, {title, year, page:1, total:0, items:[]}); }
  else S.page++;
  if (S.title.length < 2) { $('results').hidden = true; return; }
  try {
    const j = await omdb({s:S.title, y:S.year, type:S.type, page:S.page});
    const seen = new Set(S.items.map(m => m.imdbID));
    S.items.push(...(j.Search || []).filter(m => !seen.has(m.imdbID)));
    S.total = +j.totalResults || S.items.length;
  } catch (e) { setStatus(e.message, true, /key/i.test(e.message)); if (!reset) S.page--; }
  renderResults();
}

function renderResults() {
  const box = $('results');
  box.hidden = false;
  const types = [['', 'All'], ['movie', 'Movies'], ['series', 'Series']];
  const head = `<div class="rhead"><span class="count">${S.items.length ? `Showing ${S.items.length} of ${S.total}${S.year ? ' from ' + esc(S.year) : ''}` : ''}</span>
    <div class="chips" style="flex:none">${types.map(([v, l]) => `<button class="chip" data-type="${v}" aria-pressed="${S.type === v}">${l}</button>`).join('')}</div></div>`;
  const rows = S.items.map(m => {
    const added = movies.some(x => x.id === m.imdbID);
    const img = m.Poster && m.Poster !== 'N/A' ? `<img src="${esc(m.Poster)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : '<div class="ph"></div>';
    return `<div class="res">${img}<div class="t"><b>${esc(m.Title)}</b><span>${esc(m.Year)} · ${m.Type === 'series' ? 'Series' : 'Movie'}</span></div>
      <button class="btn" data-add="${esc(m.imdbID)}" ${added ? 'disabled' : ''}>${added ? 'On your list' : 'Add'}</button></div>`;
  }).join('');
  const empty = S.items.length ? '' : '<div class="note">No matches. Check the spelling or try a different year.</div>';
  const more = S.items.length < S.total ? '<div class="more"><button class="btn ghost" id="more">Show more</button></div>' : '';
  box.innerHTML = head + rows + empty + more;
}

async function add(id, btn) {
  btn.disabled = true; btn.textContent = 'Adding…';
  try {
    const d = await omdb({i:id});
    if (d.Response === 'False') throw new Error(d.Error);
    movies.unshift({
      id, title:d.Title, year:d.Year, type:d.Type,
      poster: d.Poster && d.Poster !== 'N/A' ? d.Poster : '',
      genres: d.Genre && d.Genre !== 'N/A' ? d.Genre.split(',').map(s => s.trim()) : [],
      watched:false, added:new Date().toISOString().slice(0, 10)
    });
    btn.textContent = 'On your list';
    render();
    persist(`Add ${d.Title}`);
  } catch (e) { btn.disabled = false; btn.textContent = 'Add'; setStatus(e.message, true); }
}

// ---------- render ----------
function render() {
  const genres = [...new Set(movies.flatMap(m => m.genres || []))].sort();
  if (genre !== 'all' && !genres.includes(genre)) genre = 'all';
  const n = {all:movies.length, todo:movies.filter(m => !m.watched).length, done:movies.filter(m => m.watched).length};
  $('seg').innerHTML = [['all','All'],['todo','To watch'],['done','Watched']].map(([v, l]) =>
    `<button data-v="${v}" aria-pressed="${v === view}">${l}<span class="n">${n[v]}</span></button>`).join('');
  $('chips').innerHTML = genres.length ? ['all', ...genres].map(g =>
    `<button class="chip" data-g="${esc(g)}" aria-pressed="${g === genre}">${g === 'all' ? 'All genres' : esc(g)}</button>`).join('') : '';

  const list = movies.filter(m => (view === 'all' || (view === 'done') === !!m.watched) && (genre === 'all' || (m.genres || []).includes(genre)));
  if (sort === 'title') list.sort((a, b) => a.title.localeCompare(b.title));
  if (sort === 'year') list.sort((a, b) => (parseInt(b.year) || 0) - (parseInt(a.year) || 0));

  $('grid').innerHTML = list.length ? list.map(m => `
    <article class="card ${m.watched ? 'done' : ''}">
      <div class="poster">${svg(P.image, 28)}<span>No poster</span>${m.poster ? `<img src="${esc(m.poster)}" alt="${esc(m.title)} poster" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}
        ${m.watched ? '<span class="badge">Watched</span>' : ''}
        <button class="pbtn" data-p="${esc(m.id)}" aria-label="Change poster for ${esc(m.title)}" title="Change poster">${svg(P.image)}</button></div>
      <h3 title="${esc(m.title)}">${esc(m.title)}</h3>
      <p>${esc(m.year)}${m.genres?.length ? ' · ' + esc(m.genres.slice(0, 2).join(', ')) : ''}</p>
      <div class="acts">
        <button class="btn ${m.watched ? 'ghost' : ''}" data-w="${esc(m.id)}">${m.watched ? 'Undo' : 'Mark watched'}</button>
        <button class="btn ghost x" data-x="${esc(m.id)}" aria-label="Remove ${esc(m.title)}" title="Remove">${svg(P.del)}</button>
      </div>
    </article>`).join('')
    : `<div class="empty">${movies.length ? 'Nothing matches these filters.' : 'Your list is empty. Search above to add your first title.'}</div>`;
}

// ---------- poster editor ----------
let editing = null, pOk = true;
function previewPoster() {
  const u = $('p-url').value.trim(), img = $('p-img'), st = $('p-st');
  st.className = 'pst';
  if (!u) { img.hidden = true; img.removeAttribute('src'); pOk = true; st.textContent = 'No poster will be shown for this title.'; }
  else if (!/^https?:\/\//i.test(u)) { img.hidden = true; pOk = false; st.className = 'pst err'; st.textContent = 'The link must start with http:// or https://'; }
  else { pOk = false; st.textContent = 'Loading preview…'; img.hidden = false; img.src = u; }
  $('p-save').disabled = !pOk;
}
$('p-img').onload = () => { pOk = true; $('p-st').className = 'pst'; $('p-st').textContent = 'Image loaded. Save to use it.'; $('p-save').disabled = false; };
$('p-img').onerror = () => { if (!$('p-img').getAttribute('src')) return; pOk = false; $('p-img').hidden = true; $('p-st').className = 'pst err'; $('p-st').textContent = 'This link did not load as an image. Use the direct image address (right-click an image, then Copy image address).'; $('p-save').disabled = true; };
function openPoster(id) {
  editing = movies.find(m => m.id === id);
  $('p-title').textContent = `${editing.title} (${editing.year})`;
  $('p-url').value = editing.poster || '';
  previewPoster();
  $('pdlg').showModal();
  $('p-url').focus();
}
$('p-url').addEventListener('input', previewPoster);
$('p-cancel').onclick = () => $('pdlg').close();
$('p-save').onclick = () => {
  if (!editing || !pOk) return;
  editing.poster = $('p-url').value.trim();
  $('pdlg').close(); render(); persist(`Update poster for ${editing.title}`);
};
$('p-refetch').onclick = async () => {
  const b = $('p-refetch'); b.disabled = true;
  try {
    const d = await omdb({i:editing.id});
    if (!d.Poster || d.Poster === 'N/A') { $('p-st').className = 'pst err'; $('p-st').textContent = 'IMDb has no poster for this title.'; }
    else { $('p-url').value = d.Poster; previewPoster(); }
  } catch (e) { $('p-st').className = 'pst err'; $('p-st').textContent = e.message; }
  b.disabled = false;
};

// ---------- events ----------
function queueSearch() { clearTimeout(searchTimer); searchTimer = setTimeout(() => runSearch(true), 400); }
$('q').addEventListener('input', queueSearch);
$('year').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, ''); queueSearch(); });
$('q').addEventListener('keydown', e => { if (e.key === 'Escape') { e.target.value = ''; $('year').value = ''; $('results').hidden = true; } });
$('results').addEventListener('click', e => {
  const a = e.target.closest('[data-add]'), t = e.target.closest('[data-type]');
  if (a) add(a.dataset.add, a);
  if (t) { S.type = t.dataset.type; clearTimeout(searchTimer); runSearch(true); }
  if (e.target.closest('#more')) runSearch(false);
});
$('seg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { view = b.dataset.v; render(); } });
$('chips').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { genre = b.dataset.g; render(); } });
$('sort').addEventListener('change', e => { sort = e.target.value; render(); });
$('grid').addEventListener('click', e => {
  const w = e.target.closest('[data-w]'), x = e.target.closest('[data-x]'), p = e.target.closest('[data-p]');
  if (p) openPoster(p.dataset.p);
  if (w) { const m = movies.find(m => m.id === w.dataset.w); m.watched = !m.watched; render(); persist(`${m.watched ? 'Watched' : 'Unwatch'} ${m.title}`); }
  if (x) { const m = movies.find(m => m.id === x.dataset.x); if (!confirm(`Remove “${m.title}” from your list?`)) return; movies = movies.filter(y => y !== m); render(); persist(`Remove ${m.title}`); }
});

const F = {omdb:'f-omdb', token:'f-token', owner:'f-owner', repo:'f-repo', branch:'f-branch'};
function openSettings() { for (const k in F) $(F[k]).value = cfg[k] || ''; $('dlg').showModal(); }
$('gear').onclick = openSettings;
$('cancel').onclick = () => $('dlg').close();
$('form').addEventListener('submit', () => { for (const k in F) cfg[k] = $(F[k]).value.trim(); saveCfg(); load(); });

// ---------- start ----------
load().then(() => { if (!cfg.omdb || !cfg.token) setStatus('First time here? Add your OMDb key and GitHub token.', false, true); });
</script>
</body>
</html>
